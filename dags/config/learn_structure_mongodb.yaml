    'unknown': 0
    'spine_torso': 6
    'foot': 7
    'pelvis_intrapelvic': 8
    'thorax': 9
    'upper_arm': 10
    'tibia_fibula': 11
    'neck': 12
    'lower_leg': 13
    'forearm': 14
    'elbow': 15
    'knee': 16
    'humerus': 17
    'face': 18
    'scapula': 19
    'inguinal_region': 20
    'forearm_bones': 21
    'abdomen': 22
    'gluteal_region': 23
    'ankle': 24
    'hand': 25
    'clavicle': 26
    'orbit': 27
    'hip_joint': 28
    'shoulder_joint': 29
  
  tumor_characteristics.anatomic_region_grouping:
    'deep_soft_tissue': 1
    'superficial_soft_tissue': 2
    'bone': 3

# =============================================================================
# Causal Constraints
# =============================================================================

constraints:
  edges:
    required:
      - [radiotherapy, local_recurrence]
      - [tumor_characteristics.metastasis_present_at_diagnosis, chemotherapy]
      - [tumor_characteristics.metastasis_present_at_diagnosis, metastasis]
      - [local_recurrence, metastasis]
      - [local_recurrence, NED]
      - [local_recurrence, AWD]
      - [local_recurrence, DOD]
      - [metastasis, NED]
      - [metastasis, AWD]
      - [metastasis, DOD]
      - [surgery, metastasis]
      - [surgery, local_recurrence]
      - [chemotherapy, metastasis]
      - [chemotherapy, local_recurrence]
      - [radiotherapy, metastasis]
      - [radiotherapy, local_recurrence]
    
    forbidden:
      # Blacklist: treatment → treatment (no causal connections between treatments)
      - [surgery, radiotherapy]
      - [surgery, chemotherapy]
      - [radiotherapy, surgery]
      - [radiotherapy, chemotherapy]
      - [chemotherapy, surgery]
      - [chemotherapy, radiotherapy]
      # Blacklist: metastasis → surgery/radiotherapy/chemotherapy
      - [metastasis, surgery]
      - [metastasis, radiotherapy]
      - [metastasis, chemotherapy]
      # Blacklist: local_recurrence → surgery/radiotherapy/chemotherapy
      - [local_recurrence, surgery]
      - [local_recurrence, radiotherapy]
      - [local_recurrence, chemotherapy]
      # Blacklist: NED/AWD/DOD → * (no outgoing edges from outcomes)
      - [NED, surgery]
      - [NED, chemotherapy]
      - [NED, radiotherapy]
      - [NED, metastasis]
      - [NED, local_recurrence]
      - [NED, general.gender]
      - [NED, general.age]
      - [NED, tumor_characteristics.biopsy_grading]
      - [NED, tumor_characteristics.who_diagnosis_code]
      - [NED, tumor_characteristics.anatomic_region_code]
      - [NED, tumor_characteristics.anatomic_region_grouping]
      - [NED, tumor_characteristics.metastasis_present_at_diagnosis]
      - [NED, tumor_characteristics.initial_size]
      - [AWD, surgery]
      - [AWD, chemotherapy]
      - [AWD, radiotherapy]
      - [AWD, metastasis]
      - [AWD, local_recurrence]
      - [AWD, general.gender]
      - [AWD, general.age]
      - [AWD, tumor_characteristics.biopsy_grading]
      - [AWD, tumor_characteristics.who_diagnosis_code]
      - [AWD, tumor_characteristics.anatomic_region_code]
      - [AWD, tumor_characteristics.anatomic_region_grouping]
      - [AWD, tumor_characteristics.metastasis_present_at_diagnosis]
      - [AWD, tumor_characteristics.initial_size]
      - [DOD, surgery]
      - [DOD, chemotherapy]
      - [DOD, radiotherapy]
      - [DOD, metastasis]
      - [DOD, local_recurrence]
      - [DOD, general.gender]
      - [DOD, general.age]
      - [DOD, tumor_characteristics.biopsy_grading]
      - [DOD, tumor_characteristics.who_diagnosis_code]
      - [DOD, tumor_characteristics.anatomic_region_code]
      - [DOD, tumor_characteristics.anatomic_region_grouping]
      - [DOD, tumor_characteristics.metastasis_present_at_diagnosis]
      - [DOD, tumor_characteristics.initial_size]
      # Blacklist: prevent edges between outcome indicators
      - [NED, AWD]
      - [NED, DOD]
      - [AWD, NED]
      - [AWD, DOD]
      - [DOD, NED]
      - [DOD, AWD]
      # Blacklist: treatments → baseline characteristics (prevent cycles)
      - [chemotherapy, general.age]
      - [chemotherapy, general.gender]
      - [surgery, general.age]
      - [surgery, general.gender]
      - [radiotherapy, general.age]
      - [radiotherapy, general.gender]
      # Blacklist: outcomes → baseline tumor characteristics (prevent cycles)
      - [local_recurrence, tumor_characteristics.initial_size]
      - [local_recurrence, tumor_characteristics.biopsy_grading]
      - [local_recurrence, tumor_characteristics.who_diagnosis_code]
      - [local_recurrence, tumor_characteristics.anatomic_region_code]
      - [local_recurrence, tumor_characteristics.anatomic_region_grouping]
      - [metastasis, tumor_characteristics.initial_size]
      - [metastasis, tumor_characteristics.biopsy_grading]
      - [metastasis, tumor_characteristics.who_diagnosis_code]
      - [metastasis, tumor_characteristics.anatomic_region_code]
      - [metastasis, tumor_characteristics.anatomic_region_grouping]
      - [metastasis, tumor_characteristics.metastasis_present_at_diagnosis]
      # Blacklist: tumor characteristics → baseline demographics (prevent cycles)
      - [tumor_characteristics.initial_size, general.age]
      - [tumor_characteristics.initial_size, general.gender]
      - [tumor_characteristics.biopsy_grading, general.age]
      - [tumor_characteristics.biopsy_grading, general.gender]
      - [tumor_characteristics.who_diagnosis_code, general.age]
      - [tumor_characteristics.who_diagnosis_code, general.gender]
      - [tumor_characteristics.anatomic_region_code, general.age]
      - [tumor_characteristics.anatomic_region_code, general.gender]
      - [tumor_characteristics.anatomic_region_grouping, general.age]
      - [tumor_characteristics.anatomic_region_grouping, general.gender]

      - [metastasis, local_recurrence]  # prevent cycles between outcomes
  
  tiers:
    node_to_tier:
      # Tier 0: baseline (diagnosis)
      general.age: 0
      general.gender: 0
      tumor_characteristics.initial_size: 0
      tumor_characteristics.biopsy_grading: 0
      tumor_characteristics.who_diagnosis_code: 0
      tumor_characteristics.anatomic_region_grouping: 0
      tumor_characteristics.anatomic_region_code: 0
      tumor_characteristics.metastasis_present_at_diagnosis: 0
      # Tier 1: primary treatments
      surgery: 1
      radiotherapy: 1
      chemotherapy: 1
      # Tier 2: follow-up events
      local_recurrence: 2
      metastasis: 2
      # Tier 3: terminal endpoints (patient status indicators)
      NED: 3
      AWD: 3
      DOD: 3
    
    allow_intra_tier_edges: true

# =============================================================================
# Algorithm Configuration
# =============================================================================

algorithm:
  # method options: pc, pc_stable, pc_pgmpy, ges
  # - pc: default PC algorithm (uses learn_dag function)
  # - pc_stable: custom PC-Stable with audit logging support (RESPECTS CONSTRAINTS PROPERLY)
  # - pc_pgmpy: native pgmpy.estimators.PC (expert knowledge needs post-processing)
  # - ges: Greedy Equivalence Search
  method: pc_pgmpy
  ci_test: chi_square
  significance_level: 0.25
