mongodb:
  # Connection details (uses environment variables by default)
  # uri: "mongodb://localhost:27017/"  # Uncomment to override MONGO_URI
  # database: "sarcoma_dt"              # Uncomment to override MONGO_DB
  # collection: "patients"              # Uncomment to override MONGO_COLLECTION
  
  # MongoDB query to filter documents
  query:
    # Example: only include patients with specific criteria
    # status: "completed"
    # diagnosis.metastasis_present_at_diagnosis: { $exists: true }
    {}
  
  # MongoDB aggregation pipeline
  pipeline:
    - $project:
        _id: 1
        "tumor_characteristics.biopsy_grading": 1
        # "tumor_characteristics.who_diagnosis_code": 1
        "tumor_characteristics.extremity_tumor": 1
        "tumor_characteristics.anatomic_region_grouping": 1
        "tumor_characteristics.metastasis_present_at_diagnosis": 1
        "tumor_characteristics.initial_size": 1
        "treatments.pathologist_margin_judgement": 1
        # "general.gender": 1
        "general.age": 1
        
        # last episode (max episode_id)
        last_episode:
          $reduce:
            input: { $ifNull: ["$episodes", []] }
            initialValue: null
            in:
              $cond:
                - $or:
                    - { $eq: ["$$value", null] }
                    - { $gt: ["$$this.episode_id", "$$value.episode_id"] }
                - "$$this"
                - "$$value"
        
        # per-patient flags: 1 if ANY episode has 1, else 0
        surgery:
          $ifNull:
            - $max:
                $map:
                  input: { $ifNull: ["$episodes", []] }
                  as: "e"
                  in: { $ifNull: ["$$e.surgery", 0] }
            - 0
        
        chemotherapy:
          $ifNull:
            - $max:
                $map:
                  input: { $ifNull: ["$episodes", []] }
                  as: "e"
                  in: { $ifNull: ["$$e.chemotherapy", 0] }
            - 0
        
        radiotherapy:
          $ifNull:
            - $max:
                $map:
                  input: { $ifNull: ["$episodes", []] }
                  as: "e"
                  in: { $ifNull: ["$$e.radiotherapy", 0] }
            - 0
        
        metastasis:
          $ifNull:
            - $max:
                $map:
                  input: { $ifNull: ["$episodes", []] }
                  as: "e"
                  in: { $ifNull: ["$$e.metastasis", 0] }
            - 0
        
        local_recurrence:
          $ifNull:
            - $max:
                $map:
                  input: { $ifNull: ["$episodes", []] }
                  as: "e"
                  in: { $ifNull: ["$$e.local_recurrence", 0] }
            - 0
    
    # last_status from last diagnosis element in last_episode.diagnosis
    - $set:
        last_status:
          $getField:
            field: "last_status"
            input:
              $arrayElemAt:
                - { $ifNull: ["$last_episode.diagnosis", []] }
                - -1
    
    # filter away patients without last_status
    - $match:
        $and:
          - { "tumor_characteristics.biopsy_grading": { $in: [ "G1", "G2","G3"] } } #"G1", "G2",
          - { "tumor_characteristics.anatomic_region_grouping": { $in: ["deep_soft_tissue", "superficial_soft_tissue"] } }
          - { "tumor_characteristics.metastasis_present_at_diagnosis": { $in: ["yes", "no"] } }
          - { "treatments.pathologist_margin_judgement": { $in: ["R0", "R1", "R2"] } }
          # - { "tumor_characteristics.who_diagnosis_code": { $in: ["liposarcoma", "undifferentiated_sarcoma", "leiomyosarcoma", "fibroblastic_tumor", "vascular_sarcoma"] } }
    
    # Add outcome indicator column (only DOD retained)
    - $addFields:
        DOD: { $cond: { if: { $eq: ["$last_status", "DOD"] }, then: 1, else: 0 } }

    # Compute AJCC T category and stage in a separate stage
    # - $set:
    #     ajcc_t:
    #       $switch:
    #         branches:
    #           - case: { $lte: [{ $toDouble: "$tumor_characteristics.initial_size" }, 50] }
    #             then: "T1"
    #           - case:
    #               $and:
    #                 - { $gt: [{ $toDouble: "$tumor_characteristics.initial_size" }, 50] }
    #                 - { $lte: [{ $toDouble: "$tumor_characteristics.initial_size" }, 100] }
    #             then: "T2"
    #           - case:
    #               $and:
    #                 - { $gt: [{ $toDouble: "$tumor_characteristics.initial_size" }, 100] }
    #                 - { $lte: [{ $toDouble: "$tumor_characteristics.initial_size" }, 150] }
    #             then: "T3"
    #           - case: { $gt: [{ $toDouble: "$tumor_characteristics.initial_size" }, 150] }
    #             then: "T4"
    #         default: null
    # - $set:
    #     ajcc_stage:
    #       $let:
    #         vars:
    #           g: "$tumor_characteristics.biopsy_grading"
    #           m1: "$tumor_characteristics.metastasis_present_at_diagnosis"
    #           t: "$ajcc_t"
    #         in:
    #           $switch:
    #             branches:
    #               # M1 => Stage IV
    #               - case: { $eq: ["$$m1", "yes"] }
    #                 then: "IV"

    #               # Low grade (G1): IA if T1 else IB
    #               - case:
    #                   $and:
    #                     - { $eq: ["$$m1", "no"] }
    #                     - { $eq: ["$$g", "G1"] }
    #                     - { $eq: ["$$t", "T1"] }
    #                 then: "IA"
    #               - case:
    #                   $and:
    #                     - { $eq: ["$$m1", "no"] }
    #                     - { $eq: ["$$g", "G1"] }
    #                     - { $in: ["$$t", ["T2", "T3", "T4"]] }
    #                 then: "IB"

    #               # High grade (G2/G3): II if T1, IIIA if T2, IIIB if T3/T4
    #               - case:
    #                   $and:
    #                     - { $eq: ["$$m1", "no"] }
    #                     - { $in: ["$$g", ["G2", "G3"]] }
    #                     - { $eq: ["$$t", "T1"] }
    #                 then: "II"
    #               - case:
    #                   $and:
    #                     - { $eq: ["$$m1", "no"] }
    #                     - { $in: ["$$g", ["G2", "G3"]] }
    #                     - { $eq: ["$$t", "T2"] }
    #                 then: "IIIA"
    #               - case:
    #                   $and:
    #                     - { $eq: ["$$m1", "no"] }
    #                     - { $in: ["$$g", ["G2", "G3"]] }
    #                     - { $in: ["$$t", ["T3", "T4"]] }
    #                 then: "IIIB"
    #             default: null

    - $unset: ["last_episode", "last_status"]  # Remove intermediate fields if not needed

  
  include_id: false

# =============================================================================
# Feature Selection
# =============================================================================

features:
  include:
    - surgery
    - chemotherapy
    - radiotherapy
    - metastasis
    - local_recurrence
    - DOD
    # - general.gender
    - general.age
    - tumor_characteristics.biopsy_grading
    # - tumor_characteristics.who_diagnosis_code
    - tumor_characteristics.extremity_tumor
    # - tumor_characteristics.anatomic_region_grouping
    - tumor_characteristics.metastasis_present_at_diagnosis
    - tumor_characteristics.initial_size
    - treatments.pathologist_margin_judgement
    
    # - ajcc_stage
  
  exclude: []


variable_types:
  'surgery': binary
  'chemotherapy': binary
  'radiotherapy': binary
  'metastasis': binary
  'local_recurrence': binary
  'DOD': binary
  # 'general.gender': categorical
  'general.age': numerical
  'tumor_characteristics.biopsy_grading': categorical
  # 'tumor_characteristics.who_diagnosis_code': categorical
  'tumor_characteristics.extremity_tumor': binary
  'tumor_characteristics.anatomic_region_grouping': categorical
  'tumor_characteristics.metastasis_present_at_diagnosis': binary
  'tumor_characteristics.initial_size': numerical
  'treatments.pathologist_margin_judgement': categorical
  # 'ajcc_stage': categorical

# =============================================================================
# Binning Configuration for Numerical Variables
# =============================================================================
# Discretize continuous numerical variables into bins for discrete Bayesian networks
# Only applies to numerical variables that need discretization

binning:
  'tumor_characteristics.initial_size':
    n_bins: 5
    method: 'quantile'  # 'quantile' (equal frequency) or 'uniform' (equal width)
  'general.age':
    n_bins: 5
    method: 'quantile'

# =============================================================================
# Custom Value Mappings
# =============================================================================
# Map string values to numeric codes for categorical variables
# This ensures pgmpy can properly infer datatypes

mappings:
  # general.gender:
  #   'male': 0
  #   'female': 1
  
  tumor_characteristics.biopsy_grading:
    'G1': 1
    'G2': 2
    'G3': 3
    'benign': 0
    'not_a_sarcoma': -1
    'non_diagnostic': -2
  
  tumor_characteristics.who_diagnosis_code:
    'leiomyosarcoma': 1
    'liposarcoma': 2
    'undifferentiated_sarcoma': 3
    'osteosarcoma': 4
    'benign_cartilage': 5
    'ewing_sarcoma': 6
    'fibroblastic_tumor': 7
    'gist': 8
    'chondrosarcoma': 9
    'giant_cell_tumor': 10
    'other_soft_tissue_sarcoma': 11
    'vascular_sarcoma': 12
    'benign_adipocytic': 13
    'rhabdomyosarcoma': 14
    'hematologic_malignancy': 15
    'malignant_nerve_sheath': 16
    'metastasis': 17
    'benign_bone_lesion': 18
    'other_carcinoma': 19
    'pericytic_tumor': 20
    'benign_non_neoplastic': 21
    'benign_vascular': 22
    'benign_bone': 23
    'benign_nerve_sheath': 24
  
  tumor_characteristics.metastasis_present_at_diagnosis:
    'no': 0
    'yes': 1

  tumor_characteristics.anatomic_region_grouping:
    'deep_soft_tissue': 1
    'superficial_soft_tissue': 2
    'bone': 3
  
  treatments.pathologist_margin_judgement:
    'R0': 1
    'R1': 2
    'R2': 3
  
  # ajcc_stage:
  #   'IA': 1
  #   'IB': 2
  #   'II': 3
  #   'IIIA': 4
  #   'IIIB': 5
  #   'IV': 6

# =============================================================================
# Display Name Mappings for Visualization
# =============================================================================
# Map internal column names to clean display names for DAG visualization

display_names:
  'general.age': 'Age'
  'tumor_characteristics.initial_size': 'Initial Size'
  'tumor_characteristics.biopsy_grading': 'Biopsy Grading'
  'tumor_characteristics.extremity_tumor': 'Extremity Tumor'
  'tumor_characteristics.metastasis_present_at_diagnosis': 'Metastasis at Diagnosis'
  'treatments.pathologist_margin_judgement': 'Margin Status'
  'surgery': 'Surgery'
  'radiotherapy': 'Radiotherapy'
  'chemotherapy': 'Chemotherapy'
  'local_recurrence': 'Local Recurrence'
  'metastasis': 'Metastasis'
  'DOD': 'Death of Disease'

# =============================================================================
# Causal Constraints
# =============================================================================

constraints:
  edges:
    required:
      - [treatments.any_surgery, treatments.pathologist_margin_judgement]
      # - [tumor_characteristics.metastasis_present_at_diagnosis, DOD]
      # - [radiotherapy, local_recurrence]
      # # - [tumor_characteristics.metastasis_present_at_diagnosis, chemotherapy]
      # # - [tumor_characteristics.metastasis_present_at_diagnosis, metastasis]
      # # - [local_recurrence, metastasis]
      # # - [local_recurrence, DOD]
      # # - [metastasis, DOD]
      # - [surgery, metastasis]
      # - [surgery, local_recurrence]
      # # - [chemotherapy, metastasis]
      # - [chemotherapy, local_recurrence]
      # - [radiotherapy, metastasis]
      # - [radiotherapy, local_recurrence]
      # # - [tumor_characteristics.biopsy_grading, local_recurrence]
      # # - [tumor_characteristics.biopsy_grading, metastasis]
      # # - [tumor_characteristics.biopsy_grading, metastasis]
      # # - [tumor_characteristics.biopsy_grading, radiotherapy]
      # - [tumor_characteristics.biopsy_grading, chemotherapy]
      # # - [tumor_characteristics.initial_size, tumor_characteristics.extremity_tumor]
      # - [tumor_characteristics.initial_size, tumor_characteristics.biopsy_grading]
      # # - [tumor_characteristics.initial_size, tumor_characteristics.who_diagnosis_code]
      # # - [tumor_characteristics.who_diagnosis_code, tumor_characteristics.biopsy_grading]
      # # - [tumor_characteristics.extremity_tumor, tumor_characteristics.biopsy_grading]
      # # - ['local_recurrence', 'DOD' ]
    forbidden:
      # - [tumor_characteristics.metastasis_present_at_diagnosis, tumor_characteristics.biopsy_grading]
      # - [tumor_characteristics.metastasis_present_at_diagnosis, DOD]
      # - [tumor_characteristics.biopsy_grading, tumor_characteristics.initial_size]
      # - [tumor_characteristics.who_diagnosis_code, tumor_characteristics.biopsy_grading]
      # - [tumor_characteristics.biopsy_grading, tumor_characteristics.who_diagnosis_code]
      - [tumor_characteristics.biopsy_grading, tumor_characteristics.extremity_tumor]
      # - [tumor_characteristics.biopsy_grading, metastasis]
      # - [tumor_characteristics.biopsy_grading, local_recurrence]
      # - [tumor_characteristics.initial_size, tumor_characteristics.extremity_tumor]
      # - [tumor_characteristics.initial_size, tumor_characteristics.who_diagnosis_code]

      - [tumor_characteristics.biopsy_grading, tumor_characteristics.extremity_tumor]
      # - [tumor_characteristics.who_diagnosis_code, tumor_characteristics.extremity_tumor]
      # - [tumor_characteristics.metastasis_present_at_diagnosis, tumor_characteristics.extremity_tumor]
      - [surgery, general.age]
      # - [surgery, general.gender]
      - [surgery, tumor_characteristics.initial_size]
      - [surgery, tumor_characteristics.biopsy_grading]
      # - [surgery, tumor_characteristics.who_diagnosis_code]
      # - [surgery, tumor_characteristics.anatomic_region_grouping]
      - [surgery, tumor_characteristics.extremity_tumor]
      - [surgery, tumor_characteristics.metastasis_present_at_diagnosis]
      

      - [radiotherapy, general.age]
      # - [radiotherapy, general.gender]
      - [radiotherapy, tumor_characteristics.initial_size]
      - [radiotherapy, tumor_characteristics.biopsy_grading]
      # - [radiotherapy, tumor_characteristics.who_diagnosis_code]
      # - [radiotherapy, tumor_characteristics.anatomic_region_grouping]
      - [radiotherapy, tumor_characteristics.extremity_tumor]
      - [radiotherapy, tumor_characteristics.metastasis_present_at_diagnosis]

      - [chemotherapy, general.age]
      # - [chemotherapy, general.gender]
      - [chemotherapy, tumor_characteristics.initial_size]
      - [chemotherapy, tumor_characteristics.biopsy_grading]
      # - [chemotherapy, tumor_characteristics.who_diagnosis_code]
      # - [chemotherapy, tumor_characteristics.anatomic_region_grouping]
      - [chemotherapy, tumor_characteristics.extremity_tumor]
      - [chemotherapy, tumor_characteristics.metastasis_present_at_diagnosis]

      # Tier 2 -> Tier 0
      - [local_recurrence, general.age]
      # - [local_recurrence, general.gender]
      - [local_recurrence, tumor_characteristics.initial_size]
      - [local_recurrence, tumor_characteristics.biopsy_grading]
      # - [local_recurrence, tumor_characteristics.who_diagnosis_code]
      # - [local_recurrence, tumor_characteristics.anatomic_region_grouping]
      - [local_recurrence, tumor_characteristics.extremity_tumor]
      - [local_recurrence, tumor_characteristics.metastasis_present_at_diagnosis]

      - [metastasis, general.age]
      # - [metastasis, general.gender]  

      - [metastasis, tumor_characteristics.initial_size]
      - [metastasis, tumor_characteristics.biopsy_grading]
      # - [metastasis, tumor_characteristics.who_diagnosis_code]
      # - [metastasis, tumor_characteristics.anatomic_region_grouping]
      - [metastasis, tumor_characteristics.extremity_tumor]
      - [metastasis, tumor_characteristics.metastasis_present_at_diagnosis]

      # Tier 3 -> Tier 0
      - [DOD, general.age]
      # - [DOD, general.gender]
      - [DOD, tumor_characteristics.initial_size]
      - [DOD, tumor_characteristics.biopsy_grading]
      # - [DOD, tumor_characteristics.who_diagnosis_code]
      # - [DOD, tumor_characteristics.anatomic_region_grouping]
      - [DOD, tumor_characteristics.extremity_tumor]
      - [DOD, tumor_characteristics.metastasis_present_at_diagnosis]

      # Tier 2 -> Tier 1
      - [local_recurrence, surgery]
      - [local_recurrence, radiotherapy]
      - [local_recurrence, chemotherapy]
      - [metastasis, surgery]
      - [metastasis, radiotherapy]
      - [metastasis, chemotherapy]

      # Tier 3 -> Tier 1
      - [DOD, surgery]
      - [DOD, radiotherapy]
      - [DOD, chemotherapy]

      # - [surgery, DOD]
      # - [radiotherapy, DOD]
      # - [chemotherapy, DOD]

  
  tiers:
    node_to_tier:
      # Tier 0: baseline (diagnosis)
      general.age: 0
      # general.gender: 0
      tumor_characteristics.initial_size: 0
      tumor_characteristics.biopsy_grading: 0
      # tumor_characteristics.who_diagnosis_code: 0
      # tumor_characteristics.anatomic_region_grouping: 0
      tumor_characteristics.extremity_tumor: 0
      tumor_characteristics.metastasis_present_at_diagnosis: 0
      # ajcc_stage: 0
      # Tier 1: primary treatments
      surgery: 1
      radiotherapy: 1
      chemotherapy: 1
      treatments.pathologist_margin_judgement: 1
      # Tier 2: follow-up events
      local_recurrence: 2
      metastasis: 2
      # Tier 3: terminal endpoints (patient status indicators)
      DOD: 3
    
    allow_intra_tier_edges: true

# =============================================================================
# Algorithm Configuration
# =============================================================================

algorithm:
  # method options: pc, pc_stable, pc_pgmpy, ges
  # - pc: default PC algorithm (uses learn_dag function)
  # - pc_stable: custom PC-Stable with audit logging support (RESPECTS CONSTRAINTS PROPERLY)
  # - pc_pgmpy: native pgmpy.estimators.PC (expert knowledge needs post-processing)
  # - ges: Greedy Equivalence Search
  method: pc_pgmpy
  ci_test: chi_square
  significance_level: 0.2
